name: BettingPicks
options:
  bundleIdPrefix: com.kbreed1280
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  BettingPicks:
    type: application
    platform: iOS
    sources: [BettingPicks]
    info:
      path: BettingPicks/Info.plist
      properties:
        CFBundleDisplayName: BettingPicks
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kbreed1280.BettingPicks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  BettingPicksTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BettingPicksTests]
    dependencies:
      - target: BettingPicks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.kbreed1280.BettingPicksTests
schemes:
  BettingPicks:
    build:
      targets:
        BettingPicks: all
        BettingPicksTests: [test]
    test:
      targets: [BettingPicksTests]
